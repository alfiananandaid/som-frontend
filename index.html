<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Opname Mandiri (SOM)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="css/app.css">
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div id="toast" class="toast hidden"></div>

    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view active">
        <div class="login-container">
            <div class="logo">
                <h1>SOM</h1>
                <p>Stock Opname Mandiri</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <!-- Default value admin berdasarkan koreksi user -->
                    <input type="text" id="username" placeholder="Username" value="admin" required autocomplete="username">
                </div>
                <div class="input-group password-group">
                    <input type="password" id="password" placeholder="Password" value="admin" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="icon-btn">👁️</button>
                </div>
                <button type="submit" id="btn-login" class="btn-primary">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- VIEW: MAIN APP -->
    <div id="view-main" class="view hidden">
        <header class="app-header">
            <h2 id="header-title">Dashboard</h2>
            <button id="btn-logout" class="icon-btn">🚪</button>
        </header>

        <main class="app-content">
            <!-- TAB: DASHBOARD -->
            <section id="tab-dashboard" class="tab-content active">
                <div class="welcome-card">
                    <p>Selamat datang,</p>
                    <h3 id="user-name">Loading...</h3>
                    <p class="text-sm text-gray" id="user-role">@role</p>
                </div>
                <div class="dashboard-grid">
                    <div class="dash-card">
                        <span class="dash-value">0</span>
                        <span class="dash-label">Total Item</span>
                    </div>
                    <div class="dash-card">
                        <span class="dash-value">0</span>
                        <span class="dash-label">Sudah SO</span>
                    </div>
                </div>
            </section>

            <!-- TAB: SO (SCANNER) -->
            <section id="tab-so" class="tab-content hidden">
                <div class="scanner-wrapper">
                    <div id="reader"></div>
                    <div class="scanner-controls">
                        <button id="btn-start-scan" class="btn-primary">Mulai Kamera</button>
                        <button id="btn-stop-scan" class="btn-danger hidden">Tutup Kamera</button>
                    </div>
                    
                    <div class="manual-input-box">
                        <p class="text-center text-sm text-gray">Atau Input Manual</p>
                        <div class="input-group" style="margin-top: 10px;">
                            <input type="number" id="manual-barcode" placeholder="Masukkan Barcode">
                            <button id="btn-manual-search" class="btn-secondary">Cari</button>
                        </div>
                    </div>

                    <!-- HASIL SCAN -->
                    <div id="scan-result" class="scan-result-card hidden">
                        <h4 class="status-found">PRODUK DITEMUKAN</h4>
                        <div class="product-info">
                            <p class="text-sm text-gray">Barcode</p>
                            <h3 id="res-barcode">-</h3>
                            <p class="text-sm text-gray" style="margin-top: 10px;">Deskripsi</p>
                            <p id="res-desc" style="font-weight: 600;">-</p>
                        </div>
                        
                        <div class="input-group" style="margin-top: 15px;">
                            <input type="number" id="input-qty" placeholder="Input QTY Fisik" required>
                        </div>
                        <button id="btn-save-so" class="btn-primary" style="margin-top: 10px;">SIMPAN SO</button>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="tab-dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </button>
            <button class="nav-item" data-target="tab-so">
                <span class="nav-icon">📷</span>
                <span class="nav-label">SO</span>
            </button>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
