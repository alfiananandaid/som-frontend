<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Opname Mandiri (SOM)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="toast hidden"></div>

    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view active">
        <div class="login-container">
            <div class="logo">
                <h1>SOM</h1>
                <p>Stock Opname Mandiri</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required autocomplete="username">
                </div>
                <div class="input-group password-group">
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="icon-btn">👁️</button>
                </div>
                <button type="submit" id="btn-login" class="btn-primary">LOGIN</button>
            </form>
            <div class="login-footer">
                <a href="#" id="link-forgot">Lupa Password?</a>
            </div>
        </div>
    </div>

    <!-- VIEW: MAIN APP (Dashboard, SO, dll) -->
    <div id="view-main" class="view hidden">
        <header class="app-header">
            <h2 id="header-title">Dashboard</h2>
            <button id="btn-logout" class="icon-btn">🚪</button>
        </header>

        <main class="app-content">
            <!-- TAB: DASHBOARD -->
            <section id="tab-dashboard" class="tab-content active">
                <div class="welcome-card">
                    <p>Selamat datang,</p>
                    <h3 id="user-name">Loading...</h3>
                    <p class="text-sm text-gray" id="user-role">@role</p>
                </div>
                <div class="dashboard-grid">
                    <div class="dash-card">
                        <span class="dash-value">0</span>
                        <span class="dash-label">Total Item</span>
                    </div>
                    <div class="dash-card">
                        <span class="dash-value">0</span>
                        <span class="dash-label">Sudah SO</span>
                    </div>
                </div>
            </section>

            <!-- TAB: SO -->
            <section id="tab-so" class="tab-content hidden">
                <div class="empty-state">
                    <h3>Fitur Scan Barcode</h3>
                    <p>Modul SO sedang dalam pengembangan.</p>
                </div>
            </section>
        </main>

        <!-- BOTTOM NAVIGATION (MOBILE) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-target="tab-dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </button>
            <button class="nav-item" data-target="tab-so">
                <span class="nav-icon">📷</span>
                <span class="nav-label">SO</span>
            </button>
        </nav>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
